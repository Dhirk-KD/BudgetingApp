<!DOCTYPE html>
<!-- BUDGET APP - index.html = structure + logic (JavaScript); style.css = design. Your data is saved only on your phone. -->
<html lang="en-CA" data-t="light">
<head>
<meta charset="utf-8">
<!-- Makes the page fit phone screens and extend under the notch -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- iPhone "Add to Home Screen" settings: full-screen app, status bar style, app name -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#2196f3">
<!-- Files that make the app installable: manifest.json (app info) and icon.png (home-screen icon) -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Budget</title>
<!-- All the design (colours, spacing, layout) lives in style.css -->
<link rel="stylesheet" href="Style.css">
</head>
<body>
<!-- Every page is drawn into this <main> by JavaScript -->
<main></main>
<!-- Bottom navigation bar: the 5 main tabs -->
<nav>
<button data-t="home" onclick="go('home')"><span>⌂</span>Home</button>
<button data-t="tx" onclick="go('tx')"><span>☰</span>Activity</button>
<button data-t="plan" onclick="go('plan')"><span>◧</span>Plan</button>
<button data-t="ins" onclick="go('ins')"><span>✦</span>Insights</button>
<button data-t="me" onclick="go('me')"><span>☺</span>Me</button>
</nav>
<!-- The round + button floats above the bottom bar and opens the Add form -->
<button class="fab" onclick="openAdd()">+</button>
<!-- The full-screen "New Expense / New Income" form is drawn in here -->
<div id="sh"></div>
<!-- Slide-out page menu (opened by the ☰ button at the top right of every page) -->
<div id="dr" onclick="if(event.target==this)menu(0)"></div>
<!-- Undo message that appears at the bottom after adding or deleting something -->
<div id="ts"></div>
<!-- ===== APP LOGIC (JavaScript) ===== -->
<script>
// ===== 1. BASIC SETUP =====
// K = the name your data is saved under in the phone's browser storage
// $ = shortcut to find an element on the page; pad = adds a leading zero (5 becomes 05)
const K='budget-v1',$=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
// Colours for new categories (COL) and the green used for the Savings slice (SV)
const COL=['#2196f3','#ab47bc','#ff9800','#8bc34a','#ef5350','#26a69a','#5c6bc0','#ffca28','#8d6e63','#ec407a'],SV='#00c853';
// Emoji for each category's round icon (unknown names show their first letter)
const IC={rent:'🏠','car insurance':'🚗',phone:'📱',groceries:'🛒',transport:'🚌','eating out':'🍔',subscriptions:'🔁',other:'🧾',savings:'💰',education:'📖',clothing:'👕',gift:'🎁',health:'💊'};
// Today and yesterday as YYYY-MM-DD text, and the current month (TM) as YYYY-MM
const D=new Date(),ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,today=ymd(D),yest=ymd(new Date(D.getTime()-864e5)),TM=today.slice(0,7);
// ===== 2. YOUR DATA =====
// S holds everything: income list, expense list, categories (with budgets), savings goal and theme.
// It is loaded from storage; if nothing is saved yet, it starts with default categories.
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{inc:[],exp:[],cats:['Rent','Car Insurance','Phone','Groceries','Transport','Eating Out','Subscriptions','Other'].map((n,i)=>({n,b:0,c:COL[i]}))};
// First run of this design version: use light mode and create an empty savings goal
if(S.v!==2){S.v=2;S.t='light';S.goal=S.goal||{n:'Savings goal',g:0,s:0}}
// ens: makes sure every list/setting exists (fixed bills S.fx, income sources S.fi, profile S.pf, goal S.goal)
const ens=()=>{S.goal=S.goal||{n:'Savings goal',g:0,s:0};S.pf=S.pf||{name:'',tm:'p',tv:0};if(S.pf.tv===undefined){S.pf.tm='p';S.pf.tv=S.pf.sv||0}S.tg=S.tg||{};S.fx=S.fx||[];S.fi=S.fi||[]};ens();
// save: writes S back to storage. Called after every change.
const save=()=>localStorage.setItem(K,JSON.stringify(S));
// Screen state: cur = month being viewed, tab = current page, sel = highlighted donut slice,
// kind = "exp" or "inc" in the Add form,
// dr = the Add form's draft values (amount, date, note, source, category)
let cur=TM,tab='home',sel=-1,kind='exp',dr={a:'',d:today,n:'',s:'',c:0};
// ===== 3. HELPER FUNCTIONS =====
// shift: moves a month forward/back, e.g. shift("2026-10",-1) gives "2026-09"
function shift(m,k){const[y,mo]=m.split('-').map(Number),d=new Date(y,mo-1+k,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`}
// fm: formats a number as Canadian dollars
const fm=n=>n.toLocaleString('en-CA',{style:'currency',currency:'CAD'});
// lab: turns "2026-10" into "October 2026" (or "Oct 2026" when s is set)
const lab=(m,s)=>new Date(m+'-01T00:00').toLocaleDateString('en-CA',{month:s?'short':'long',year:'numeric'});
// esc: makes typed text safe to show on the page
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
// col: finds a category's colour by its name
const col=n=>(S.cats.find(c=>c.n===n)||{c:'#8a94a8'}).c;
// ic: builds a round coloured icon
const ic=(n,c,e)=>`<span class="ic" style="background:${c}">${e||(S.cats.find(x=>x.n==n)||{}).e||IC[n.toLowerCase()]||esc(n[0].toUpperCase())}</span>`;
// months: the last 12 months, newest first
const months=()=>[...Array(12)].map((_,k)=>shift(TM,-k));
// tot: adds up one month. Returns i = income, e = expenses, by = expenses per category,
// n = income minus expenses (your savings)
function tot(m){const by={};let e=0;S.exp.filter(x=>x.d.startsWith(m)).forEach(x=>{by[x.cat]=(by[x.cat]||0)+x.a;e+=x.a});const i=S.inc.filter(x=>x.d.startsWith(m)).reduce((a,x)=>a+x.a,0);return{i,e,by,n:i-e}}
// ring: draws the donut arcs. Each item becomes an arc sized by its share of the total.
// If lb is set, a % label is placed outside the ring for every slice of 4% or more.
function ring(items,k,lb){
 const T=items.reduce((a,x)=>a+x.v,0);let off=0;
 return items.map((x,j)=>{const p=x.v/T*100,l=Math.max(p-.8,.1);
  let s=`<circle r="15.915" cx="21" cy="21" fill="none" stroke="${x.c}" stroke-width="${k===j?6:4.2}" stroke-dasharray="${l} ${100-l}" stroke-dashoffset="${25-off}" onclick="pick(${j})" style="cursor:pointer;transition:stroke-width .2s"/>`;
  if(lb&&p>=4){const a=(off+p/2)/100*6.2832-1.5708;s+=`<text class="lb" x="${(21+21.5*Math.cos(a)).toFixed(2)}" y="${(21+21.5*Math.sin(a)).toFixed(2)}">${p.toFixed(0)}%</text>`}
  off+=p;return s}).join('')}
// hd: builds the blue header (title, optional month switcher, optional back button, and the ☰ menu button at the top right)
const hd=(t,mo,bk)=>`<div class="hd"><button class="mn" onclick="menu(1)">☰</button>${bk?`<button class="bk" onclick="go('${bk}')">←</button>`:''}<div class="ht">${t}</div>${mo?`<div class="mo"><button onclick="mv(-1)">‹</button><b>${lab(cur).toUpperCase()}</b><button onclick="mv(1)">›</button></div>`:''}</div>`;
// stats: builds the Income / Spent / Saved row
const stats=t=>`<div class="st"><div><small>Income</small><b class="ok">${fm(t.i)}</b></div><div><small>Spent</small><b class="bad">${fm(t.e)}</b></div><div><small>Saved</small><b class="${t.n<0?'bad':'ok'}">${fm(t.n)}</b></div></div>`;
// ===== 4. PAGES (each function returns the HTML for one screen) =====
// dv = which Dashboard tab is open ('ov' Overview, 'in' Income, 'bu' Expenses)
// Compare page: cm = what is charted (i income, e expenses, n savings), cn = number of months shown, cs = selected month
let dv='ov',cm='n',cn=6,cs=TM;
// dn: builds a donut card. items = [{n: name, v: value, c: colour}]. pill/top/main/sub = text in the centre of the ring.
// It also builds the dot legend and the detail rows (icon, name, %, amount) under the chart.
function dn(items,pill,top,main,sub){
 const T=items.reduce((a,x)=>a+x.v,0),c=items[sel];
 if(!T)return '<div class="empty">Nothing yet this month.<br>Tap + to add income or an expense.</div>';
 return `<div class="dn"><svg viewBox="-6 -6 54 54">${ring(items,sel,1)}</svg><div class="ct">${pill?`<span class="pill">${pill}</span>`:''}<small>${top}</small><b>${main}</b><small>${sub}</small></div>${c?`<div class="tip">${esc(c.n)} ${(c.v/T*100).toFixed(0)}%</div>`:''}</div>
 <div class="lg">${items.map((x,j)=>`<span onclick="pick(${j})"><i style="background:${x.c}"></i>${esc(x.n)}</span>`).join('')}</div>`+
 items.map((x,j)=>`<div class="lr ${sel===j?'on':''}" onclick="pick(${j})">${ic(x.n,x.c)}<div>${esc(x.n)}<br><small>${(x.v/T*100).toFixed(1)}%</small></div><b class="${x.n=='Savings'?'ok':''}">${fm(x.v)}</b></div>`).join('')}
// home: the Dashboard. Three tabs: Overview (income = expenses + savings), Income (by source), Expenses (by category + budgets)
function home(){
 const t=tot(cur),{i,e,by,n}=t;
 const exps=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([nm,v])=>({n:nm,v,c:col(nm)}));
 const B=S.cats.reduce((a,c)=>a+(c.b||0),0),fb=fxBy(cur);
 let items=exps,pill='',top="You've Spent",main=fm(e),sub='',note='',extra='';
 if(dv=='ov'){ // Overview: the ring is your income; expenses take slices and what is left is Savings
  if(n>0)items=[...exps,{n:'Savings',v:n,c:SV}];
  pill=i?Math.round(e/i*100)+'%':'';sub=i?'of '+fm(i):'no income yet';
  if(n<0)note=`You've spent ${fm(-n)} more than you earned this month.`}
 if(dv=='in'){ // Income tab: where this month's income came from
  const src={};S.inc.filter(x=>x.d.startsWith(cur)).forEach(x=>src[x.s]=(src[x.s]||0)+x.a);
  items=Object.entries(src).map(([nm,v],j)=>({n:nm,v,c:COL[j%COL.length]}));top='Total Income';main=fm(i);sub='this month'}
 if(dv=='bu'){ // Expenses tab: spending by category, with budget alerts and budget items
  top='Total Expenses';pill=B?Math.round(e/B*100)+'%':'';sub=B?'of '+fm(B)+' budget':'this month';
  const w=S.cats.filter(c=>c.b>0&&by[c.n]).map(c=>({c,p:Math.round(by[c.n]/c.b*100)})).sort((a,b)=>b.p-a.p)[0];
  if(w&&w.p>=50)note=`${w.c.n} spending is ${w.p}% of its budget.${w.p>=100?' You are over budget.':' Keep an eye on it.'}`;
  extra=S.cats.filter(c=>c.b>0).map(c=>{const v=by[c.n]||0,u=(fb[c.n]||{}).u||0,p=(v+u)/c.b*100,k=p>100?'var(--bad)':c.c;return `<div class="bit"><div class="top">${ic(c.n,c.c)}<div>${esc(c.n)}<br><small>${fm(v)} / ${fm(c.b)}${u?` · ${fm(u)} fixed still to pay`:''}</small></div><b style="color:${k}">${p.toFixed(0)}%</b></div><div class="bar"><u style="width:${Math.min(p,100)}%;background:${k};opacity:.35"></u><u class="ov" style="width:${Math.min(v/c.b*100,100)}%;background:${k}"></u></div></div>`}).join('')
   ||'<div class="empty">Set category budgets from the menu (top right) &rarr; Budgets &amp; settings.</div>'}
 const seg=[['ov','Overview'],['in','Income'],['bu','Expenses']].map(([k,l])=>`<button class="${dv==k?'on':''}" onclick="dv='${k}';sel=-1;render()">${l}</button>`).join('');
 return hd(S.pf.name?'Hi, '+esc(S.pf.name):'Dashboard',1)+`<div class="sheet">${stats(t)}${fxCard()}<div class="seg">${seg}</div>${note?`<div class="bn"><i>i</i>${esc(note)}</div>`:''}${dn(items,pill,top,main,sub)}${extra?'<h3 style="margin-top:20px">Budget items</h3>'+extra:''}</div>`}
// Transactions page: income and expenses for the month, grouped by date, with delete buttons
function txp(){
 const t=tot(cur),L=[...S.inc.filter(x=>x.d.startsWith(cur)).map(x=>({...x,k:'inc',t:x.s})),...S.exp.filter(x=>x.d.startsWith(cur)).map(x=>({...x,k:'exp',t:x.cat}))].sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
 let h='',last='';
 L.forEach(x=>{if(x.d!==last){last=x.d;h+=`<h3 class="dh">${x.d==today?'Today':x.d==yest?'Yesterday':x.d}</h3>`}
  h+=`<div class="tx" onclick="editTx('${x.k}',${x.id})">${x.k=='inc'?ic(x.t,'#4caf50','💵'):ic(x.t,col(x.t))}<div>${esc(x.t)}<br><small>${x.k=='inc'?'Income':'Expense'}${x.n?' | '+esc(x.n):''}</small></div><b class="${x.k=='inc'?'ok':'bad'}">${x.k=='inc'?'':'−'}${fm(x.a)}</b><button onclick="event.stopPropagation();del('${x.k}',${x.id})">✕</button></div>`});
 return hd('Transactions',1)+`<div class="sheet">${stats(t)}${h||'<div class="empty">No transactions this month.</div>'}</div>`}
// Savings page: this month's savings, goal progress bar, saved-vs-remaining donut and the goal editor.
// Total saved = starting amount + (income minus expenses) added up over every month logged.
function savp(){
 const t=tot(cur),G=S.goal,ms=[...new Set([...S.inc,...S.exp].map(x=>x.d.slice(0,7)))];
 const net=ms.reduce((a,m)=>a+tot(m).n,0),saved=G.s+net,g=G.g,pct=g>0?Math.max(0,Math.min(saved/g*100,100)):0;
 const avg=ms.length?net/ms.length:0,eta=g>saved&&avg>0?Math.ceil((g-saved)/avg):0;
 const items=g>0?[{n:'Saved',v:Math.max(saved,0),c:SV},{n:'Remaining',v:Math.max(g-saved,0),c:'#90a4ae'}].filter(x=>x.v>0):[];
 return hd('Savings',1)+`<div class="sheet"><div class="box"><small>Saved in ${lab(cur,1)}</small><div class="big2 ${t.n<0?'bad':'ok'}">${fm(t.n)}</div><small>${t.i>0?(t.n/t.i*100).toFixed(0)+'% of income':'Add income to see your savings rate'}${tgtTxt(t)}</small></div>
 <h3>${esc(G.n)}</h3><div class="box"><div class="cr" style="margin:0"><div><b>${fm(saved)}</b><span class="r">${g>0?'of '+fm(g):'no goal set'}</span></div><div class="bar"><u style="width:${pct}%;background:${SV}"></u></div></div><small>${g>0?pct.toFixed(0)+'% reached'+(eta?` · about ${eta} month${eta>1?'s':''} to go at your average`:saved>=g?' · goal reached! 🎉':''):'Set a target below'}</small></div>
 ${items.length?`<div class="dn" style="width:200px"><svg viewBox="0 0 42 42">${ring(items,-1)}</svg><div class="ct"><small>Goal</small><b>${pct.toFixed(0)}%</b></div></div>`+items.map(x=>`<div class="lr">${ic(x.n,x.c,x.n=='Saved'?'💰':'🎯')}<div>${x.n}</div><b>${fm(x.v)}</b></div>`).join(''):''}
 <h3 style="margin-top:20px">Edit goal</h3><input value="${esc(G.n)}" placeholder="Goal name" onchange="S.goal.n=this.value;save();render()"><input type="number" inputmode="decimal" value="${G.g||''}" placeholder="Target amount" onchange="S.goal.g=parseFloat(this.value)||0;save();render()"><input type="number" inputmode="decimal" value="${G.s||''}" placeholder="Already saved before using the app" onchange="S.goal.s=parseFloat(this.value)||0;save();render()"><small>Total saved = starting amount + income minus spending from every month you've logged.</small></div>`}
// History page: last 12 months with income/spending bars; tap a month to open it
function hist(){
 const t=months().map(m=>({m,...tot(m)})),mx=Math.max(1,...t.map(x=>Math.max(x.i,x.e)));
 return hd('History')+`<div class="sheet">`+t.map(x=>`<div class="box" onclick="cur='${x.m}';sel=-1;go('home')"><div class="cr" style="margin:0"><div><b>${lab(x.m)}</b><span class="r ${x.n<0?'bad':'ok'}">Saved ${fm(x.n)}</span></div></div><div class="bar"><u style="width:${x.i/mx*100}%;background:#4caf50"></u></div><div class="bar"><u style="width:${x.e/mx*100}%;background:var(--hd)"></u></div><small>In ${fm(x.i)} · Out ${fm(x.e)}</small></div>`).join('')+'<small>Tap a month to open it.</small></div>'}
// kf: short money labels for the chart's y-axis (e.g. $1.5k). sm: short month name (Jan, Feb...)
const kf=n=>n>=1000?'$'+(n/1000).toFixed(1)+'k':'$'+Math.round(n);
const sm=m=>new Date(m+'-01T00:00').toLocaleDateString('en-CA',{month:'short'});
// cmpv: Compare page. Tabs switch between Income / Expenses / Savings. The bar chart shows the last 6 or 12 months;
// tap a bar to pick a month. The big number is that month's total, with the % change from the month before.
function cmpv(){
 const ml=months().slice(0,cn).reverse(),val=m=>{const t=tot(m);return cm=='i'?t.i:cm=='e'?t.e:t.n};
 if(!ml.includes(cs))cs=TM;
 const v=ml.map(val),mx=Math.max(1,...v.map(x=>Math.max(x,0))),cv=val(cs),pv=val(shift(cs,-1));
 const ch=pv?(cv-pv)/Math.abs(pv)*100:null,good=cm=='e'?ch<0:ch>0,nm={i:'Income',e:'Expenses',n:'Savings'}[cm],t=tot(cs);
 // rows = the breakdown list under the chart for the selected month: [icon, name, amount, colour class]
 let rows;
 if(cm=='i'){const src={};S.inc.filter(x=>x.d.startsWith(cs)).forEach(x=>src[x.s]=(src[x.s]||0)+x.a);rows=Object.entries(src).map(([k,a],j)=>[ic(k,COL[j%COL.length],'💵'),k,a,''])}
 else if(cm=='e')rows=Object.entries(t.by).sort((a,b)=>b[1]-a[1]).map(([k,a])=>[ic(k,col(k)),k,a,''])
 else rows=[[ic('Income','#4caf50','💵'),'Income',t.i,''],[ic('Spent','#ef5350','🧾'),'Spent',t.e,''],[ic('Saved',SV,'💰'),'Saved',t.n,t.n<0?'bad':'ok']];
 return hd('Compare')+`<div class="sheet"><div class="seg">${[['i','Income'],['e','Expenses'],['n','Savings']].map(([k,l])=>`<button class="${cm==k?'on':''}" onclick="cm='${k}';render()">${l}</button>`).join('')}</div>
 <div class="ca"><small>${nm} analytics</small><select onchange="cn=+this.value;render()"><option value="6" ${cn==6?'selected':''}>Last 6 months</option><option value="12" ${cn==12?'selected':''}>Last 12 months</option></select></div>
 <div><span class="big3">${fm(cv)}</span>${ch==null?'':`<span class="chg ${good?'ok':'bad'}">${ch>0?'▲':ch<0?'▼':''} ${Math.abs(ch).toFixed(1)}%</span>`}</div>
 <small>${lab(cs)}${ch==null?'':' vs '+lab(shift(cs,-1),1)}</small>
 <div class="bc mc" style="margin-top:14px"><div class="ax">${[0,1,2,3,4].map(k=>`<span>${kf(mx*k/4)}</span>`).join('')}</div><div class="pl">${ml.map((m,j)=>`<div class="gc" onclick="cs='${m}';render()"><div class="gr"><u style="height:${Math.max(v[j],0)/mx*100}%;background:${m==cs?'var(--hd)':'var(--bb)'}"></u></div><small>${sm(m)}</small></div>`).join('')}</div></div>
 <h3 style="margin-top:22px">${lab(cs)}</h3>${rows.length?rows.map(([ico,k,a,c])=>`<div class="lr">${ico}<div>${esc(k)}</div><b class="${c}">${fm(a)}</b></div>`).join(''):'<div class="empty">Nothing recorded this month.</div>'}</div>`}

// ===== 4b. FIXED BILLS =====
// addDays: a date plus n days (as a Date). dl: short date like "Nov 6". ord: 1 -> 1st, 2 -> 2nd, 3 -> 3rd...
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return d};
const dl=d=>new Date(d+'T00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric'});
const ord=n=>n+((n%100>=11&&n%100<=13)?'th':['th','st','nd','rd'][n%10]||'th');
// isPaid: has this bill occurrence (key = billId@dueDate) already been added to your expenses?
const isPaid=k=>S.exp.some(x=>x.fx==k);
// occ: the due dates of fixed bill b inside month m. Monthly bills use the due day (short months use their last day);
// "every 2 weeks" bills count forward from their first due date.
function occ(b,m){
 const[y,mo]=m.split('-').map(Number),dim=new Date(y,mo,0).getDate();
 if(b.rep=='m')return m<b.m0?[]:[`${m}-${pad(Math.min(b.day,dim))}`];
 const r=[];
 for(let k=0;k<300;k++){const d=ymd(addDays(b.start,14*k));if(d.slice(0,7)>m)break;if(d.startsWith(m))r.push(d)}
 return r}
// fxSum: total fixed bills due this month (t) and how much of it is already paid (p)
function fxSum(){let t=0,p=0;S.fx.forEach(b=>occ(b,TM).forEach(d=>{t+=b.a;if(isPaid(b.id+'@'+d))p+=b.a}));return{t,p}}
// fxBy: fixed bills due in month m grouped by category: {category: {t: total due, u: still unpaid}}
function fxBy(m){const r={};S.fx.forEach(b=>occ(b,m).forEach(d=>{const o=r[b.cat]=r[b.cat]||{t:0,u:0};o.t+=b.a;if(!isPaid(b.id+'@'+d))o.u+=b.a}));return r}
// fxCard: the small "Fixed bills" card on the Dashboard (tap it to open the Fixed bills page)
function fxCard(){const{t,p}=fxSum();return t?`<div class="fcard" onclick="go('fix')"><div class="cr" style="margin:0"><div><b>Fixed bills</b><span class="r">${fm(p)} of ${fm(t)} paid</span></div><div class="bar"><u style="width:${p/t*100}%;background:#00c853"></u></div></div><small>${p<t?'Still to pay this month: '+fm(t-p):'All paid this month'}</small></div>`:''}
// sync: adds anything that is due but missing. Runs when the app opens or comes back to the screen.
// Auto-add bills become expenses on/after their due day.
// Anything you deleted (stored in S.sk) is not added again.
function sync(){
 let c=0;const sk=S.sk||[];
 [shift(TM,-1),TM].forEach(m=>S.fx.filter(b=>b.auto).forEach(b=>occ(b,m).forEach(d=>{
  const k=b.id+'@'+d;

 const g={};S.exp.filter(x=>!x.fx&&x.n).forEach(x=>{const k=x.n.toLowerCase()+'|'+x.a;(g[k]=g[k]||[]).push(x)});
 subs=Object.values(g).filter(a=>new Set(a.map(x=>x.d.slice(0,7))).size>=2&&!S.fx.some(b=>b.n.toLowerCase()==a[0].n.toLowerCase())).map(a=>{const l=a[a.length-1];return{n:l.n,a:l.a,cat:l.cat,day:+l.d.slice(8),m:new Set(a.map(x=>x.d.slice(0,7))).size}}).slice(0,5);
 const sb=subs.map((s,j)=>`<div class="tx">${ic(s.cat,col(s.cat))}<div>${esc(s.n)}<br><small>${fm(s.a)} · seen in ${s.m} months</small></div><span class="chip" style="cursor:pointer" onclick="subFx(${j})">Add to Fixed bills</span></div>`).join('');
 // 6. Freelance helper: compare budgets with your lowest recent income month, and a tax set-aside calculator
 const i6=[...Array(6)].map((_,k)=>tot(shift(cur,-k)).i).filter(v=>v>0),low=i6.length?Math.min(...i6):0,rate=S.pf.tx!=null?S.pf.tx:20;
 const fl=`<p style="margin-top:0">${low?`Your lowest income month recently was <b>${fm(low)}</b>.${B>low?` Your budgets add up to ${fm(B)}, so a slow month like that could leave you short.`:' Your budgets fit within it, so you are covered even in a slow month.'}`:'Log some income to see how your slow months compare to your budgets.'}</p><p>Set aside <input type="number" inputmode="decimal" value="${rate}" onchange="S.pf.tx=parseFloat(this.value)||0;save();render()" style="width:72px;display:inline-block;margin:0 6px">% of this month's income for taxes = <b>${fm(t.i*rate/100)}</b>.</p><small>Choose a rate that matches what you expect to owe. An accountant can help you pick one.</small>`;
 // 7. What-if: how much sooner you reach your savings goal if you spend a little less each month
 const mm=[...new Set([...S.inc,...S.exp].map(x=>x.d.slice(0,7)))],net=mm.reduce((a,m)=>a+tot(m).n,0),av=mm.length?net/mm.length:0,gl=S.goal.g,rg=gl-(S.goal.s+net),cut=S.pf.wi!=null?S.pf.wi:50;
 const m1=av>0?Math.ceil(rg/av):0,m2=av+cut>0?Math.ceil(rg/(av+cut)):0;
 const wi=!gl?'<small>Set a savings goal on the Savings page to see this.</small>':rg<=0?'<p style="margin:0">You have already reached your goal. 🎉</p>':`<p style="margin-top:0">If you cut <input type="number" inputmode="decimal" value="${cut}" onchange="S.pf.wi=parseFloat(this.value)||0;save();render()" style="width:80px;display:inline-block;margin:0 6px"> a month from your spending, you would reach your goal in <b>${m2||'?'} months</b>${m1?` instead of ${m1} (${m1-m2} sooner)`:''}.</p>`;
 // 8. Share with AI: shows exactly what will be copied, then you paste it into your own AI chat
 const sh=`<small>Get deeper advice from your own AI chat. Only totals per category are included: no notes, names or individual transactions. This is what will be copied:</small><textarea class="ta" id="ai" readonly>${esc(aiText())}</textarea><div class="ch"><button class="b1" onclick="copyAi(this)">Copy summary</button><a class="b2 lk" href="https://claude.ai/new" target="_blank" rel="noopener">Open Claude</a></div><small>Paste it into the chat and ask for your report.</small>`;
 return hd('Insights',1)+`<div class="sheet">${box('Monthly report',rpt)}${fc?box('Forecast',fc):''}${box('Budget suggestions',hs.length?'<small>Based on your last '+hs.length+' month'+(hs.length>1?'s':'')+' of spending, plus 5% breathing room.</small>'+sg:'<small>Log expenses for at least one full month to get suggestions.</small>')}${un?box('Unusual spending',un):''}${sb?box('Looks like a subscription',sb):''}${box('Freelance income',fl)}${box('What if you spend less?',wi)}${box('Share with AI',sh)}</div>`}
// ===== 5a. TABS & TOAST (UNDO MESSAGE) =====
// The bottom bar has 5 tabs. Plan and Insights hold several sub-pages, picked with the row of buttons at the top of the page.
// SUBS lists them, sub remembers which one is open in each tab, wrap adds the button row to a page, pk = the page open right now.
const SUBS={plan:[['bud','Budgets'],['fix','Bills'],['calc','Income'],['sav','Savings']],ins:[['ins','Insights'],['hist','History'],['cmp','Compare']]};
let sub={plan:'bud',ins:'ins'};
const wrap=(t,m)=>{const bar=`<div class="seg">${SUBS[t].map(([k,l])=>`<button class="${sub[t]==k?'on':''}" onclick="sub['${t}']='${k}';render()">${l}</button>`).join('')}</div>`;return m[sub[t]]().replace('<div class="sheet">','<div class="sheet">'+bar)};
const pk=()=>tab=='plan'?sub.plan:tab=='ins'?sub.ins:tab=='me'?'pro':tab;
// toast: a message at the bottom of the screen for 5 seconds, with an Undo button when an undo action is given
let tmr,undoFn=null;
function toast(msg,undo){undoFn=undo||null;$('#ts').innerHTML=`<span>${esc(msg)}</span>${undo?'<button onclick="doUndo()">Undo</button>':''}`;$('#ts').classList.add('show');clearTimeout(tmr);tmr=setTimeout(()=>$('#ts').classList.remove('show'),5000)}
const doUndo=()=>{if(undoFn)undoFn();undoFn=null;$('#ts').classList.remove('show')};
// ===== 5. SCREEN CONTROLS =====
// render: redraws the current page and highlights the matching nav button. Called after every change.
function render(){
 document.documentElement.dataset.t=S.t;
 $('main').innerHTML={home,tx:txp,plan:()=>wrap('plan',{bud:sett,fix:fixp,sav:savp,calc:calcp}),ins:()=>wrap('ins',{ins:insp,hist,cmp:cmpv}),me:prof}[tab]();
 const nt=tab;
 document.querySelectorAll('nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==nt))}
// go = switch page, mv = previous/next month, pick = highlight/unhighlight a donut slice
const go=t=>{const m={bud:['plan','bud'],set:['plan','bud'],fix:['plan','fix'],calc:['plan','calc'],sav:['plan','sav'],ins:['ins','ins'],hist:['ins','hist'],cmp:['ins','cmp'],pro:['me']};if(m[t]){tab=m[t][0];if(m[t][1])sub[tab]=m[t][1]}else tab=t;render();scrollTo(0,0)},mv=k=>{cur=shift(cur,k);sel=-1;render()},pick=i=>{sel=sel===i?-1:i;render()};
// menu: opens (1) or closes (0) the slide-out page menu (the ☰ button, top right). Lists every page; the current one is highlighted.
function menu(o){
 if(o)$('#dr').innerHTML=`<div class="dw"><h3>Pages</h3>${[['home','Home','⌂'],['tx','Activity','☰'],['bud','Budgets','⚙'],['fix','Fixed bills','🔁'],['calc','Income goal','🎯'],['sav','Savings','◈'],['ins','Insights','💡'],['hist','History','📅'],['cmp','Compare','⇄'],['pro','Profile','👤']].map(([k,l,g])=>`<button class="${pk()==k?'on':''}" onclick="menu(0);go('${k}')"><span>${g}</span>${l}</button>`).join('')}</div>`;
 $('#dr').classList.toggle('open',!!o)}
// del = delete a transaction, delCat = delete a category (Settings)
const del=(k,id)=>{const x=S[k].find(y=>y.id===id);if(!x)return;const sk0=S.sk?[...S.sk]:[];if(x.fx){S.sk=S.sk||[];S.sk.push(x.fx)}S[k]=S[k].filter(y=>y.id!==id);save();render();toast('Deleted '+fm(x.a),()=>{S[k].push(x);S.sk=sk0;save();render()})};
const delCat=i=>{if(confirm('Remove this category? Expenses already logged keep its name.')){S.cats.splice(i,1);save();render()}};
// ===== 6. ADD INCOME / EXPENSE FORM =====
// Type the amount on the big keypad (tapKey), tap a recent entry to fill everything in (useRec), pick a category, then Save.
// Typed values are kept in dr. rc = the recent entries shown as chips (recent builds the list).
let rc=[];
function recent(){const s=new Set(),r=[],L=kind=='exp'?S.exp:S.inc;for(let i=L.length-1;i>=0&&r.length<6;i--){const x=L[i];if(x.fx)continue;const k=(x.n||'')+'|'+(x.cat||x.s)+'|'+x.a;if(!s.has(k)){s.add(k);r.push(x)}}return r}
const useRec=j=>{const x=rc[j];dr.a=String(x.a);dr.n=x.n||'';if(kind=='exp')dr.c=Math.max(0,S.cats.findIndex(c=>c.n==x.cat));else dr.s=x.s;openAdd()};
const tapKey=k=>{let a=dr.a||'';if(k=='⌫')a=a.slice(0,-1);else if(k=='.'){if(!a.includes('.'))a=(a||'0')+'.'}else if(!/\.\d\d$/.test(a)&&a.length<9)a=(a=='0'?'':a)+k;dr.a=a;const e=$('#amt');e.textContent='$'+(a||'0');e.classList.remove('err')};
// openAdd: draws the full-screen form (green for income, blue for expense) with the keypad fixed at the bottom
function openAdd(){
 const inc=kind=='inc',hc=inc?'#4caf50':'#2196f3';rc=recent();
 if(dr.c>=S.cats.length)dr.c=0;
 $('#sh').innerHTML=`<div class="ad"><div class="ah" style="background:${hc}"><div class="ar"><button onclick="closeAdd()">←</button><b>${dr.e?'Edit':'New'} ${inc?'Income':'Expense'}</b>${dr.e?'<span style="width:26px"></span>':`<div class="tg"><button class="${inc?'':'on'}" onclick="kind='exp';openAdd()">Expense</button><button class="${inc?'on':''}" onclick="kind='inc';openAdd()">Income</button></div>`}</div><small>Amount (CAD)</small><div class="big" id="amt">$${esc(dr.a||'0')}</div></div>
 <div class="ab">${rc.length&&!dr.e?`<small>Recent</small><div class="ch rc">${rc.map((x,j)=>`<button class="cp" onclick="useRec(${j})">${esc(inc?x.s:x.n||x.cat)} · ${fm(x.a)}</button>`).join('')}</div>`:''}
 <div class="ch">${[['Today',today],['Yesterday',yest]].map(([l,d])=>`<button class="cp ${dr.d==d?'on':''}" onclick="dr.d='${d}';openAdd()">${l}</button>`).join('')}<input type="date" value="${dr.d}" onchange="dr.d=this.value;openAdd()"></div>
 ${inc?`<input placeholder="Source (e.g. Client A, Side gig)" value="${esc(dr.s)}" oninput="dr.s=this.value">`:`<div class="cgr">${S.cats.map((c,i)=>`<button class="cg ${dr.c==i?'on':''}" onclick="dr.c=${i};openAdd()">${ic(c.n,c.c)}<small>${esc(c.n)}</small></button>`).join('')}</div>`}
 <input placeholder="Description (optional)" value="${esc(dr.n)}" oninput="dr.n=this.value"></div>
 <div class="kp">${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>`<button onclick="tapKey('${k}')">${k}</button>`).join('')}<button class="ksv" onclick="add()">Save</button></div></div>`;
 $('#sh').classList.add('open')}
// closeAdd: hides the form and clears the draft
const closeAdd=()=>{$('#sh').classList.remove('open');$('#sh').innerHTML='';dr={a:'',d:today,n:'',s:'',c:dr.c}};
// editTx: tap a transaction to change it. Opens the same form as + with the details filled in (dr.e = the item being edited).
const editTx=(k,id)=>{const x=(k=='exp'?S.exp:S.inc).find(y=>y.id===id);if(!x)return;kind=k;dr={a:String(x.a),d:x.d,n:x.n||'',s:x.s||'',c:Math.max(0,S.cats.findIndex(c=>c.n==x.cat)),e:id};openAdd()};
// add: checks the amount, saves the new income/expense, then shows the Dashboard for that month
function add(){
 const a=parseFloat(dr.a);if(!(a>0))return $('#amt').classList.add('err');
 const d=dr.d||today,id=Date.now(),n=dr.n.trim();
 const ed=!!dr.e,o=kind=='exp'?{cat:(S.cats[dr.c]||{n:'Other'}).n,a,d,n}:{s:(dr.s||'').trim()||'Income',a,d,n},list=kind=='exp'?S.exp:S.inc;
 if(ed){const x=list.find(y=>y.id===dr.e);if(x)Object.assign(x,o)}else list.push({id,...o});
 cur=d.slice(0,7);sel=-1;save();closeAdd();go(ed?'tx':'home');toast(ed?'Saved':'Added '+fm(a),ed?null:(k0=>()=>{S[k0]=S[k0].filter(y=>y.id!==id);save();render()})(kind))}
// ===== 7. BACKUP =====
// exp: downloads all your data as a .json file. imp: restores your data from one.
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='budget-backup-'+today+'.json';a.click()}
function imp(f){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.cats||!d.exp||!d.inc)throw 0;S=d;ens();save();render()}catch(e){alert('Invalid backup file')}};r.readAsText(f.files[0])}
// ===== 8. START THE APP =====
// Draw the first screen, then register the service worker (lets the app work offline)
sync();render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){sync();render()}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
